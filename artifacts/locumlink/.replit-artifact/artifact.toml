kind = "web"
previewPath = "/"
title = "LocumLink Kenya"
version = "1.0.0"
id = "artifacts/locumlink"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19780

[services.development]
run = "pnpm --filter @workspace/locumlink run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/locumlink", "run", "build" ]
publicDir = "artifacts/locumlink/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19780"
BASE_PATH = "/"
